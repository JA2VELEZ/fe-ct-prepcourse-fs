<title>Rutas Don Ramón</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Herramienta interna: pegar mensaje → ruta y kilómetros. Una columna, mismas fichas que la app de clientes */
:root {
  --bg: #ffffff; --field: #f2f1ec; --field-hover: #e9e8e1; --fg: #141414; --muted: #74736c;
  --line: #e2e1da; --accent: #c3f21f; --accent-fg: #141414; --danger: #c4372b; --ok: #2f7d32;
  --font: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #111210; --field: #1e1f1c; --field-hover: #282925; --fg: #f3f3ee; --muted: #a2a299; --line: #2f302b; --danger: #ff7a6e; --ok: #7bd67f; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #111210; --field: #1e1f1c; --field-hover: #282925; --fg: #f3f3ee; --muted: #a2a299; --line: #2f302b; --danger: #ff7a6e; --ok: #7bd67f; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.45; }
.wrap { max-width: 620px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; display: flex; flex-direction: column; gap: 14px; }
h1 { font-size: 1.4rem; font-weight: 800; margin: 0; letter-spacing: -0.01em; }
.sub { margin: 0; color: var(--muted); font-size: 0.92rem; }
.badge { align-self: flex-start; background: var(--fg); color: var(--bg); font-size: 0.72rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; }
label.lbl { font-weight: 700; font-size: 0.95rem; }
textarea { width: 100%; min-height: 190px; border: 2px solid var(--line); border-radius: 18px; background: var(--field); color: var(--fg); font: inherit; font-size: 0.9rem; padding: 14px 16px; resize: vertical; }
textarea:focus { outline: none; border-color: var(--fg); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 0; border-radius: 16px; font: inherit; font-weight: 800; padding: 12px 18px; cursor: pointer; background: var(--field); color: var(--fg); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--field-hover); }
.btn.main { background: var(--accent); color: var(--accent-fg); font-size: 1.05rem; padding: 16px 20px; justify-content: center; width: 100%; }
.btn:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.check { display: inline-flex; gap: 8px; align-items: center; font-size: 0.9rem; font-weight: 600; }
.stops { display: flex; flex-direction: column; gap: 8px; }
.stop { background: var(--field); border-radius: 16px; padding: 12px 16px; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; }
.stop .tag { grid-row: span 2; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 0.85rem; background: var(--fg); color: var(--bg); }
.stop b { font-size: 0.82rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.stop span { min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
.stop small { grid-column: 2; color: var(--ok); font-weight: 700; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat { border: 2px solid var(--line); border-radius: 16px; padding: 12px 16px; }
.stat b { display: block; font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.stat span { font-size: 0.82rem; color: var(--muted); font-weight: 600; }
.note { margin: 0; font-size: 0.85rem; color: var(--muted); }
.warn { color: var(--danger); font-weight: 700; }
@media (max-width: 420px) { .stats { grid-template-columns: 1fr; } }
</style>

<main class="wrap">
  <span class="badge">Solo para Don Ramón</span>
  <h1>Rutas y kilómetros</h1>
  <p class="sub">Pega el mensaje que te llegó del cliente por WhatsApp. Te muestro el recorrido y los kilómetros. El cliente no ve nada de esto.</p>

  <label class="lbl" for="msg">Mensaje del cliente</label>
  <textarea id="msg" spellcheck="false"></textarea>
  <div class="row">
    <button type="button" class="btn" id="paste">📋 Pegar</button>
    <button type="button" class="btn" id="clear">Borrar</button>
    <label class="check"><input type="checkbox" id="paradaAlFinal"> La parada va después de la entrega</label>
  </div>

  <div id="out" class="stops" aria-live="polite"></div>
  <div class="stats" id="stats" hidden>
    <div class="stat" id="statRoad" hidden><b id="road">—</b><span>Por carretera</span></div>
    <div class="stat" id="statTime" hidden><b id="time">—</b><span>Tiempo manejando aprox.</span></div>
    <div class="stat" id="statLine" hidden><b id="line">—</b><span>En línea recta (mínimo)</span></div>
  </div>
  <a class="btn main" id="gmaps" href="#" target="_blank" rel="noopener" hidden>🧭 Ver ruta y kilómetros exactos en Google Maps</a>
  <p class="note" id="info"></p>
</main>

<script>
const EJEMPLO = `✅ *SOLICITUD DE TRASTEO*  (ejemplo)

📍 *Dirección de recogida:*
🌎 Departamento: Antioquia
🌆 Municipio: Medellín
🏡 Barrio / sector: Laureles (Comuna 11 · Laureles - Estadio)
🏠 Dirección: Cra 76 # 33-20
🏢 Acceso: Edificio con ascensor · Piso 8

🏁 *Dirección de entrega:*
🌎 Departamento: Antioquia
🌆 Municipio: Envigado
🏡 Barrio / sector: Zúñiga
🏠 Dirección: Cl 40 Sur # 27-15
🏢 Acceso: Primer piso / casa`;

const $ = (id) => document.getElementById(id);

function parse(text) {
  const blocks = { recogida: null, parada: null, entrega: null };
  let cur = null;
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.replace(/\*/g, "").trim();
    if (/direcci[oó]n de recogida|origen/i.test(line) && line.endsWith(":")) { cur = blocks.recogida = {}; continue; }
    if (/direcci[oó]n de entrega|destino/i.test(line) && line.endsWith(":")) { cur = blocks.entrega = {}; continue; }
    if (/parada adicional/i.test(line) && line.endsWith(":")) { cur = blocks.parada = {}; continue; }
    if (!cur) continue;
    if (line === "") { cur = null; continue; }
    const m = line.match(/^[^\p{L}]*([\p{L} /]+?):\s*(.*)$/u);
    if (!m) continue;
    const key = m[1].toLowerCase().trim(), val = m[2].trim();
    if (key.startsWith("departamento")) cur.dep = val;
    else if (key.startsWith("municipio")) cur.mun = val;
    else if (key.startsWith("barrio")) cur.bar = val.replace(/\s*\(.*\)\s*$/, "");
    else if (key.startsWith("direcci")) cur.dir = val;
    else if (key.startsWith("ubicaci")) cur.link = val;
  }
  for (const b of Object.values(blocks)) if (b) {
    const c = b.link && b.link.match(/[?&]q=(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/);
    if (c) b.coords = { lat: +c[1], lng: +c[2] };
    b.texto = [b.dir, b.bar, b.mun, b.dep, "Colombia"].filter(Boolean).join(", ");
    b.query = b.coords ? `${b.coords.lat},${b.coords.lng}` : b.texto;
  }
  return blocks;
}

function haversine(a, b) {
  const R = 6371, rad = (d) => d * Math.PI / 180;
  const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const km = (n) => n < 1 ? `${Math.round(n * 1000)} m` : `${n.toLocaleString("es-CO", { maximumFractionDigits: 1 })} km`;

let lastKey = "";
async function run() {
  const b = parse($("msg").value);
  const order = [b.recogida];
  if (b.parada && !$("paradaAlFinal").checked) order.push(b.parada);
  order.push(b.entrega);
  if (b.parada && $("paradaAlFinal").checked) order.push(b.parada);
  const stops = order.filter(Boolean);
  const names = { recogida: "Recogida", parada: "Parada", entrega: "Entrega" };
  const nameOf = (s) => Object.keys(b).find((k) => b[k] === s);

  $("out").innerHTML = "";
  stops.forEach((s, i) => {
    const el = document.createElement("div"); el.className = "stop";
    el.innerHTML = `<div class="tag">${String.fromCharCode(65 + i)}</div><b></b><span></span>${s.coords ? "<small>📌 Punto exacto marcado en el mapa</small>" : ""}`;
    el.querySelector("b").textContent = names[nameOf(s)];
    el.querySelector("span").textContent = s.texto;
    $("out").appendChild(el);
  });

  const ok = b.recogida && b.entrega;
  $("gmaps").hidden = !ok; $("stats").hidden = !ok;
  ["statRoad", "statTime", "statLine"].forEach((id) => $(id).hidden = true);
  if (!ok) {
    $("info").innerHTML = $("msg").value.trim() ? '<span class="warn">No encontré la dirección de recogida y la de entrega. Pega el mensaje completo del cliente.</span>' : "";
    return;
  }

  const url = new URL("https://www.google.com/maps/dir/");
  url.searchParams.set("api", "1");
  url.searchParams.set("origin", stops[0].query);
  url.searchParams.set("destination", stops[stops.length - 1].query);
  if (stops.length > 2) url.searchParams.set("waypoints", stops.slice(1, -1).map((s) => s.query).join("|"));
  url.searchParams.set("travelmode", "driving");
  $("gmaps").href = url.toString();

  const allCoords = stops.every((s) => s.coords);
  let info = "Google Maps te muestra la ruta exacta, los kilómetros y el tiempo con tráfico.";
  if (allCoords) {
    let d = 0; for (let i = 1; i < stops.length; i++) d += haversine(stops[i - 1].coords, stops[i].coords);
    $("line").textContent = km(d); $("statLine").hidden = false;
    const key = stops.map((s) => `${s.coords.lng},${s.coords.lat}`).join(";");
    if (key !== lastKey) {
      lastKey = key;
      try {
        const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${key}?overview=false`);
        const j = await r.json();
        if (j.routes && j.routes[0]) {
          $("road").textContent = km(j.routes[0].distance / 1000); $("statRoad").hidden = false;
          $("time").textContent = `${Math.round(j.routes[0].duration / 60)} min`; $("statTime").hidden = false;
        }
      } catch (_) { /* sin conexión al servicio de rutas: queda Google Maps */ }
    }
  } else {
    info = "El cliente no marcó todos los puntos en el mapa, así que uso las direcciones escritas. " + info;
  }
  $("info").textContent = info;
}

$("msg").value = EJEMPLO;
$("msg").addEventListener("input", run);
$("paradaAlFinal").addEventListener("change", () => { lastKey = ""; run(); });
$("clear").addEventListener("click", () => { $("msg").value = ""; run(); $("msg").focus(); });
$("paste").addEventListener("click", async () => {
  try { $("msg").value = await navigator.clipboard.readText(); run(); }
  catch (_) { $("msg").focus(); $("msg").select(); $("info").textContent = "Mantén presionado en el cuadro y elige Pegar."; }
});
run();
</script>
